<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Sticky Glassmorphic Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="nav-brand">
        <span class="nav-brand-logo">IL</span>
        <span class="nav-brand-text">IVAN LARININ</span>
      </a>

      <ul class="nav-links">
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="mailto:ilarin75@gmail.com" class="btn btn-secondary btn-sm">✉️ Email</a>
        <a href="https://github.com/Veltrynox" target="_blank" rel="noopener" class="btn btn-primary btn-sm">GitHub</a>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <main class="container">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© {{ 'now' | date: "%Y" }} Ivan Larinin • Personal Portfolio & Showcase</p>
    </div>
  </footer>

  <!-- Interactive Scripts -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
