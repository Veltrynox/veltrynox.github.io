---
layout: default
---

<div class="article-container">
  <nav class="breadcrumb">
    <a href="{{ '/' | relative_url }}">Home</a>
    <span>/</span>
    <a href="{{ '/blog.html' | relative_url }}">Blog</a>
    <span>/</span>
    <span>{{ page.title }}</span>
  </nav>

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

  <div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-light); text-align: center;">
    <a href="{{ '/blog.html' | relative_url }}" class="btn btn-primary">← Back to All Articles</a>
  </div>
</div>
